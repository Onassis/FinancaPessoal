#Porta do Tomcat
server.port=8081
#Link de chamada 
server.servlet.context-path=/financapessoal
## PostgreSQL
spring.jpa.database=POSTGRESQL

#Hibernate Batch insert e updade 
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=true
#Tempo de conexao
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.minimumIdle=20
spring.datasource.hikari.maximumPoolSize=30
spring.datasource.hikari.connectionTimeout=50000
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG 
#logging.level.com.zaxxer.hikari=TRACE 
#Gera log de query lentas 	
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=10
#Log 
#logging.level.org.springframework.web=error
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate=error
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = true
logging.level.org.hibernate.SQL=error
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=trace

