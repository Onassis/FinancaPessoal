<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head><meta charset="UTF-8"></head>

<main id="main" class="main" layout:fragment="corpo">
   
   <section class="layout-content" >
	
	        <nav class="navbar navbar-expand-md bg-light">
	            <div class="collapse navbar-collapse" id="navbarsExampleDefault">
	                <ul class="navbar-nav mr-auto">
	                    <li class="nav-item active">
	                        <i class="oi oi-caret-right"></i>
	                        <span>Cadastrar Categoria</span>
	                    </li>
	                </ul>
	            </div>
	            <a class="btn btn-primary btn-md" th:href="@{/categoria/listar/C}" role="button">
	                <span class="oi oi-spreadsheet" title="Cadastro" aria-hidden="true"></span>
	                <span>Listar categoria</span>
	            </a>
	        </nav>
	
	        <div class="container" id="cadastro">
		
    <div class="col-lg-6 bg-light">
	 <div class="card">
		 <div class="card-body">
			 <h5 class="card-title">Cadastro de categoria</h5>
			<div th:replace="~{fragments/alert}"></div>	 
		
   		<form id="CadastroForm" th:object="${categoriaDTO}" th:action="@{/categoria}"  class="row g-3 needs-validation"   method="POST">

   		  
					<div
						th:replace="~{fragments/forms::inputRow(object='categoriaDTO', field='tipoCategoria', type='select',options= ${opTipoCategoria}, readOnly='readOnly',rowClass='col-md-12')}" />
					<div
						th:replace="~{fragments/forms::inputRow(object='categoriaDTO', field='tipoLancamento', type='select',options= ${opTiposLancamento}, readOnly='readOnly',rowClass='col-md-12')}" />
					<div
						th:replace="~{fragments/forms::inputRow(object='categoriaDTO', field='descricao', required='required',rowClass='col-md-12')}" />
			
						
			<input type="hidden" id="id" th:field="*{id}"/>
	        <input type="hidden" id="versao" th:field="*{versao}" />	
	         <div class="text-center">	   		
	        	<button type="submit" id="btnSalvar" class="btn btn-primary"  >Salvar</button>
	       	    <button onclick="history.go(-1);" class="btn btn-secondary">Voltar</button>

	        </div>	  		
    </form>
    
</div>
</div>
</div>
  <script th:src="@{/js/cadastro.js}"></script>

 </section>
	</main>
 
</html>
