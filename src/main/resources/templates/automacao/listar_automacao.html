<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head><meta charset="UTF-8"></head>
<main id="main" class="main" layout:fragment="corpo">
     <div class="row">
          <div class="col-lg-12">
            <ol class="breadcrumb">
              <li><i class="fa fa-home"></i><a href="home.html"> Home </a></li>
              <li>  <i class="fa fa-bars"></i> Listar Automação </li>
            </ol>
          </div>
     </div>		
	<nav class="navbar navbar-expand-md bg-light">
			<div class="collapse navbar-collapse" id="navbarsExampleDefault">
				<ul class="navbar-nav mr-auto">
					<li class="nav-item active">
						<i class="oi oi-caret-right"></i>
						<span>Lista de Automação</span>
					</li>
				</ul>
			</div>
			<a id="btnadd" class="btn btn-primary btn-md" rel="modal:open" th:href="@{/automacao/cadastrar}" role="button"> 
			 	<span 	class="oi oi-plus" title="Cadastro" aria-hidden="true"></span> 
			 	<span>Nova Automação</span>
			</a>
	</nav>
	
		

			<div th:replace="~{fragments/alert}"></div>
<!-------------------------------------------------- Lista ------------------------------------------------------------>	
	  	<div class="Containner">
	  	<div class="row">
				<div class="card">
					<div class="table-responsive" >				
							<table class="table table-bordered table-striped table-hover ">
								<thead class="thead-light">	<div class="row">
								<tr>
									<th><i class="icon_profile"></i> criterio</th>
									<th><i class="money-check-alt"></i> Tipo Operação</th>
									<th><i class="money-check-alt"></i> Favorecido</th>
									<th><i class="money-check-alt"></i> Conta</th>
									<th><i class="money-check-alt"></i> Categoria</th>
									<th><i class="icon_cogs"></i> Ação</th>
								</tr>
							</thead>
							<tbody>
									<tr th:each="f : ${automacao}">
										<td th:text="${f?.criterio}">criterio</td>
										<td th:text="${f?.TipoOperacao?.getDescricao()}">nome</td>										
										<td th:text="${f?.favorecido?.nome}">nome</td>
										<td th:text="${f?.contaTransferencia?.apelido}">nome</td>
										<td th:text="${f?.subCategoria?.descricao}">categoria</td>
										<td colspan="2" align="center">
											 <a id="btn_editar" th:href="@{/automacao/editar/{id} (id=${f.id}) }" title="Editar"	 
												    class="fa-regular fa-pen-to-square icon-dark"></a>           
          								 	 <a id="btn_deletar" th:href="@{/automacao/excluir/{id} (id=${f.id}) }" title="Excluir"          										     
            										class="fa-regular fa-trash-can icon-dark btn-delete"></a>
        								</td>								

								
									</tr>
							</tbody>		
						</table>
			  </div>
			</div>
		</div>
			</div>

  <script th:src="@{/js/cadastro.js}"></script>
  </main>  
</html>
