<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head><meta charset="UTF-8"></head>

<main id="main" class="main" layout:fragment="corpo">
   
   <section class="layout-content" >
	
	        <nav class="navbar navbar-expand-md bg-light">
	            <div class="collapse navbar-collapse" id="navbarsExampleDefault">
	                <ul class="navbar-nav mr-auto">
	                    <li class="nav-item active">
	                        <i class="oi oi-caret-right"></i>
	                        <span>Cadastrar automacao</span>
	                    </li>
	                </ul>
	            </div>
	            <a class="btn btn-primary btn-md" th:href="@{/automacao/listar}" role="button">
	                <span class="oi oi-spreadsheet" title="Cadastro" aria-hidden="true"></span>
	                <span>Listar automacao</span>
	            </a>
	        </nav>
	
	        <div class="automacaoiner" id="cadastro">
		
    <div class="col-lg-6 bg-light">
		 <div class="card">
			 <div class="card-body">
				 <h5 class="card-title">Cadastro de automação</h5>
				<div th:replace="~{fragments/alert}"></div>	 
				<form id="CadastroForm" th:object="${automacao}" th:action="@{/automacao}"  class="row g-3 needs-validation"   method="POST">
			   		<div th:replace="~{fragments/forms::inputRow(object='automacao', field='tipoOperacao', type='select',required='required',options= ${tipoOperacao},readOnly='readOnly',rowClass='col-md-12')}" />				   
	      			<div th:replace="~{fragments/forms::inputRow(object='automacao', field='ordem', required='true',rowClass='col-md-12')}" />
			   		<div th:replace="~{fragments/forms::inputRow(object='automacao', field='subCategoria', type='select',required='required',options= ${categoriasDTO},rowClass='col-md-12')}" />

			   		<div th:replace="~{fragments/forms::inputRow(object='automacao', field='favorecido', type='select',options=${favorecidos},rowClass='col-md-6')}" />
			   		<div th:replace="~{fragments/forms::inputRow(object='automacao', field='contaTransferencia', type='select',options= ${contas},rowClass='col-md-6')}" />
	      			
        			<input class="form-control" type="text" id="criterioAdd" name="criterioAdd">
       
    			    <button id="btnAddCriterio" class="btn btn-primary">Adciona criterio</button>
    			    
	      			<table id="criterioTable" class="table table-bordered table-striped table-hover ">
						<thead class="thead-light">	<div class="row">
								<tr>
									<th><i class="icon_profile"></i>Criterio</th>
									<th><i class="icon_cogs"></i>Ação</th>
								</tr>
						</thead>
						<tbody>
							<tr th:each="c : ${automacao.criterios}">
								<td th:text="${c}">criterio</td>
								<td colspan="2" align="center">
									 <a id="btn_editar"  title="Editar"	 
										    class="fa-regular fa-pen-to-square icon-dark" ></a>           
          						 	 <a id="btn_deletar"  title="Excluir"          										     
            								class="fa-regular fa-trash-can icon-dark btn-delete"></a>
        						 </td>								

								
							</tr>
						</tbody>		
					</table>
					<input type="hidden" id="criterio" th:field="*{criterio}"/>	
					<input type="hidden" id="id" th:field="*{id}"/>
	        		<input type="hidden" id="versao" th:field="*{versao}" />	
	         		<div class="text-center">	   		
	        			<button type="submit" id="btnSalvar" class="btn btn-primary"  >Salvar</button>
	       	    		<button onclick="history.go(-1);" class="btn btn-secondary">Voltar</button>
	        		</div>	  		
				</form>
	    
			</div>
		</div>
	</div>
  	<script th:src="@{/js/cadastro.js}"></script>
	<script th:src="@{/js/criterio.js}"></script>
 </section>
</main>
 
</html>
