<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head><meta charset="UTF-8"></head>

<main id="main" class="main" layout:fragment="corpo">
   
   <section class="layout-content" >
	
	        <nav class="navbar navbar-expand-md bg-light">
	            <div class="collapse navbar-collapse" id="navbarsExampleDefault">
	                <ul class="navbar-nav mr-auto">
	                    <li class="nav-item active">
	                        <i class="oi oi-caret-right"></i>
	                        <span>Cadastrar Lançamento</span>
	                    </li>
	                </ul>
	            </div>
	            <a class="btn btn-primary btn-md" th:href="@{/lancamento/listar}" role="button">
	                <span class="oi oi-spreadsheet" title="Cadastro" aria-hidden="true"></span>
	                <span>Listar Lançamento</span>
	            </a>
	        </nav>
	
	        <div class="container" id="cadastro">
		
    <div class="col-lg-6 bg-light">
	 <div class="card">
		 <div class="card-body">
			 <h5 class="card-title">Lançamento Credito</h5>
			<div th:replace="~{fragments/alert}"></div>	 
		
	    	<form id="editForm"  th:object="${lancamentoDTO}"  th:action="@{/lancamento}"  method="POST" class="row g-3 needs-validation">	
				
	 			 <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='dataDoc', type='date', rowClass='col-md-6')}" />
	  
			  
  			  <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='total', type='moeda', rowClass='col-md-6')}" />   
			    
			       					  		   	
			  <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='contaLancamento', type='select',required='required',options= ${contasCorrente},readOnly='readOnly',rowClass='col-md-12')}" /> 
		
		
	
		
			  <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='subCategoria', type='select',options= ${subCategoriasCredito},readOnly='readOnly',rowClass='col-md-12')}" /> 
			  
			  <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='informacao',  rowClass='col-md-12')}" />    
			 


		
			  
		   
			  <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='conciliado', type='checkbox',inputClass='form-check-input',rowClass='col-md-6')}" />
   		  
			 <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='dataPgto', type='date', readOnly='readOnly', rowClass='col-md-6')}" />
			 <div th:replace="~{fragments/forms::inputRow(object='lancamentoDTO', field='valorPgto', type='moeda', inputClassappend='col-form-label', rowClass='col-md-6')}" />
    

			<input type="hidden" id="tipoOperacao" th:field="*{tipoOperacao}" th:value='CR'/>
		  		                       
            	      <div class="form-group">
   						<input type="hidden" id="lancamentoId" th:field="*{lancamentoId}"/>   		
   						<input type="hidden" id="detalheLancamentoId" th:field="*{detalheLancamentoId}"/>   				
	        	        <input type="hidden" id="lancAuxId" th:field="*{idLancAux}"/>
	        	        <input type="hidden" id="id" th:field="*{id}"/>
    				</div>    
    		
     		<div class="text-center">	   		
	        	<button type="submit" id="btnSalvar" class="btn btn-primary"  >Salvar</button>
				 <a  th:href="@{/lancamento/listar}" class="btn btn-secondary">Voltar</a>
	        </div>    				         	                
	     </form>
</div>
</div>
</div>
 <script th:src="@{/js/cadastro.js}"></script>
  <script th:src="@{/js/conciliacao.js}"></script>
 <script th:src="@{/js/filtro-select.js}"></script>
	 
 </script>
 </section>
	</main>
 
</html>
