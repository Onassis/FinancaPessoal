<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fragment Navbar</title>

</head>
<body>
    <div th:fragment="navbar(cadastro,showListar)">
    	<div class="row">
		<div class="col-lg-12">
			<nav>
				<ol class="breadcrumb">

					<li class="breadcrumb-item"><a href="/financapessoal">Home</a></li>
					<li class="breadcrumb-item">
					  <span th:text="${cadastro}"></span>
					</li>
					<li th:if="${showListar}" class="breadcrumb-item active">Listar</li>
					<li th:unless="${showListar}" class="breadcrumb-item active">Cadastro</li>
				</ol>
			</nav>

		</div>
	</div>
        <nav class="navbar navbar-expand-md bg-light">
            <div th:if="${showListar}" class="collapse navbar-collapse" id="navbarsExampleDefault">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <i class="oi oi-caret-right"></i>
                        <span th:text="'Lista de ' + ${cadastro}">Listar</span>
                    </li>
                </ul>
            </div>
             <div th:unless="${showListar}" class="collapse navbar-collapse" id="navbarsExampleDefault">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <i class="oi oi-caret-right"></i>
                        <span th:text="'Cadastrar ' + ${cadastro}">Cadastrar automacao</span>
                    </li>
                </ul>
            </div>
           <a class="btn btn-primary btn-md" 
            	 th:unless="${showListar}" 
            	 th:attr="data-normalize-param=@{'/' + ${cadastro} + '/listar'}"  
            	 role="button">
                <span class="oi oi-spreadsheet" title="Cadastro" aria-hidden="true"></span>
                <span th:text="'Listar ' + ${cadastro}">Listar automacao</span>
            </a>
            <a id="btnadd" class="btn btn-primary btn-md" rel="modal:open"
              	th:if="${showListar}" 
              	 th:attr="data-normalize-param=@{'/' + ${cadastro} + '/cadastrar'}"              	 
            	role="button"> 
            	<span class="oi oi-plus" title="Cadastro" aria-hidden="true"></span>
            	<span th:text="'Novo ' + ${cadastro}">Cadastrar</span>
			</a>
        </nav>
        <script th:src="@{/js/util.js}"></script>
        <script>
          // Atualiza links no DOM
        	document.addEventListener("DOMContentLoaded", function () {
            const links = document.querySelectorAll("[data-normalize-param]");
            links.forEach(link => {
                const rawParam = link.getAttribute("data-normalize-param");
                const normalizedParam = normalizeUrl(rawParam);
                link.href = normalizedParam;
            });
        });
    </script>
    </div>

</body>
</html>
