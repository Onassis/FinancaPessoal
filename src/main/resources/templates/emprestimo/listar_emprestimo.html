<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head><meta charset="UTF-8"></head>
<main id="main" class="main" layout:fragment="corpo">
     <div class="row">
          <div class="col-lg-12">
            <ol class="breadcrumb">
              <li><i class="fa fa-home"></i><a href="home.html"> Home </a></li>
              <li>  <i class="fa fa-bars"></i> Listar Emprestimo </li>
            </ol>
          </div>
     </div>		
	<nav class="navbar navbar-expand-md bg-light">
			<div class="collapse navbar-collapse" id="navbarsExampleDefault">
				<ul class="navbar-nav mr-auto">
					<li class="nav-item active">
						<i class="oi oi-caret-right"></i>
						<span>Lista de Emprestimo</span>
					</li>
				</ul>
			</div>
			<a id="btnadd" class="btn btn-primary btn-md" rel="modal:open" th:href="@{/emprestimo/cadastrar}" role="button"> 
			 	<span 	class="oi oi-plus" title="Cadastro" aria-hidden="true"></span> 
			 	<span>Nova Emprestimo</span>
			</a>
	</nav>
	
		

			<div th:replace="~{fragments/alert}"></div>
<!-------------------------------------------------- Lista ------------------------------------------------>	
	  	<div class="Containner">
	  	<div class="row">
				<div class="card">
					<div class="table-responsive" >				
			<table class="table table-striped table-hover table-sm">		
					<th>
							<th>Dt.Venc</th>							
							<th>Conta</th>							
							<th>Informação</th>
							<th>Categoria</th>
							<th>Total</th>
							<th>Prestação</th>
							<th>Favorecido</th>
							<th>Dt.Documento</th>
							<th>Conciliado</th>
							<th>Valor</th>
							<th><i class="icon_cogs"></i> Ação</th>
						</tr>		
			<tbody>
				<tr th:each="l : ${emprestimoDTO}">		 		
					<td th:text="${#temporals.format(l.dataDoc, 'dd/MM/yyyy')}">2017/08/14</td>
					<td th:text="${l?.contaLancamento?.getApelido()}">Conta lancamento</td>	
					<td th:text="${l?.informacao}">Informação</td> 					
					<td th:text="${l?.SubCategoria?.getDescricao()}">Categorial</td>	
					<td th:text="${l?.total}">Total</td>	
					<td th:text="${l?.valor}">Prestação</td>					
					<td th:text="${l?.Favorecido?.getNome()}">Favorecido</td>
					<td th:text="${#temporals.format(l?.DataDoc, 'dd/MM/yyyy')}">2017/08/14</td>					 			
					<td th:text="${l?.conciliado}" align="center">Concialiado lancamento</td>	
				    <td th:text="|R$ ${#numbers.formatDecimal(l?.total, 1, 'DEFAULT', 2, 'DEFAULT')}|" align="right"></td>	
				    <td colspan="2" align="center">
						 <a id="btn_editar" th:href="@{/emprestimo/editar/{id} (id=${l.lancamentoId}) }" title="Editar"	 
							    class="fa-regular fa-pen-to-square icon-dark"></a>           
          				 <a id="btn_deletar" th:href="@{/emprestimo/excluir/{id} (id=${l.lancamentoId}) }" title="Excluir"          										     
            					class="fa-regular fa-trash-can icon-dark btn-delete"></a>
        			</td>
				 </tr>
				 <tr>  
				    <td colspan="6"> </td> 
					<td colspan="6" th:text="|R$ ${#numbers.formatDecimal(#aggregates.sum(emprestimoDTO.![total]) ?: 0 ,1, 'DEFAULT', 2, 'DEFAULT')}|" </td>        		
				 </tr>  					    								
			</tbody>
		</div>
	</div>
</table>
<script th:src="@{/js/search.js}"></script>
					 	</div>							
				</div>
		</div>
</div>		
		<script th:src="@{/js/cadastro.js}"></script>
 			<script th:src="@{/js/search.js}"></script>
	</main>  
</html>
