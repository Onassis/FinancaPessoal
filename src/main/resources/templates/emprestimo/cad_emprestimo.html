<!DOCTYPE html>
<html layout:decorate="~{layout}">

<head>
	<meta charset="UTF-8">
</head>

<main id="main" class="main" layout:fragment="corpo">

	<section class="layout-content">

		<nav class="navbar navbar-expand-md bg-light">
			<div class="collapse navbar-collapse" id="navbarsExampleDefault">
				<ul class="navbar-nav mr-auto">
					<li class="nav-item active">
						<i class="oi oi-caret-right"></i>
						<span>Cadastrar Emprestimos</span>
					</li>
				</ul>
			</div>
			<a class="btn btn-primary btn-md" th:href="@{/lancamento/listar}" role="button">
				<span class="oi oi-spreadsheet" title="Cadastro" aria-hidden="true"></span>
				<span>Listar Emprestimos</span>
			</a>
		</nav>

		<div class="container" id="cadastro">

			<div class="col-lg-6	 bg-light">
				<div class="card">
					<div class="card-body">
						<h5 class="card-title">Cadastro de Emprestimos</h5>
						<div th:replace="~{fragments/alert}"></div>

						<form id="editForm" th:object="${emprestimoDTO}" th:action="@{/emprestimo}" method="POST"
							class="row g-3 needs-validation">
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='dataDoc', type='date', required='required', rowClass='col-md-6')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='contaLancamento', type='select',options= ${contas},readOnly='readOnly',rowClass='col-md-6')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='total', type='moeda',required='required', rowClass='col-md-12')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='subCategoria', type='select',options= ${subCategoriasDebito},rowClass='col-md-12')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='dataVenc', type='date', required='required', rowClass='col-md-6')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='valor', type='moeda', required='required', rowClass='col-md-6')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='nroInicialPrestacao', required='required', rowClass='col-md-6')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='nroPrestacao',required='required',  rowClass='col-md-6')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='entrada', type='checkbox',inputClass='form-check-input')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='conciliado', type='checkbox',inputClass='form-check-input')}" />
							<div th:replace="~{fragments/forms::inputRow(object='emprestimoDTO', field='informacao',  rowClass='col-md-12')}" />

							<div class="form-group">
								<input type="hidden" id="tipoOperacao" th:field="*{tipoOperacao}" th:value='DB' />
								<input type="hidden" id="lancamentoId" th:field="*{lancamentoId}" />
								<input type="hidden" id="id" th:field="*{id}" />
							</div>
							<div class="text-center">
								<button type="submit" id="btnSalvar" class="btn btn-primary">Salvar</button>
								<a th:href="@{/emprestimo/listar}" class="btn btn-secondary">Voltar</a>
							</div>
						</form>
					</div>
				</div>
			</div>
			<script th:src="@{/js/cadastro.js}"></script>

	</section>
</main>

</html>
