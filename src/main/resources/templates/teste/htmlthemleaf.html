<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Duplo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        .range-container {
            position: relative;
            height: 20px;
            margin-top: 20px;
        }

        .range-track {
            position: absolute;
            width: 100%;
            height: 5px;
            background-color: #ddd;
            border-radius: 5px;
            top: 50%;
            transform: translateY(-50%);
        }

        .range-selected {
            position: absolute;
            height: 5px;
            background-color: #0d6efd;
            border-radius: 5px;
            top: 50%;
            transform: translateY(-50%);
        }

        .range-thumb {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 50%;
            cursor: pointer;
            top: 50%;
            transform: translateY(-50%);
        }

        .range-thumb.lower {
            z-index: 1;
        }

        .range-thumb.upper {
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <form th:action="@{/salvar}" method="post" th:object="${rangeForm}">
                    <div class="mb-3">
                        <label for="range" class="form-label">Valor Inicial: <span id="valorInicialOutput" th:text="*{valorInicial}">0</span> - Valor Final: <span id="valorFinalOutput" th:text="*{valorFinal}">100</span></label>
                        <div class="range-container">
                            <div class="range-track"></div>
                            <div class="range-selected"></div>
                            <div class="range-thumb lower" id="lowerThumb"></div>
                            <div class="range-thumb upper" id="upperThumb"></div>
                            <input type="range" class="form-range" id="valorInicial" min="1" max="100" th:field="*{valorInicial}" style="position: absolute; width: 100%; height: 20px; opacity: 0;">
                            <input type="range" class="form-range" id="valorFinal" min="1" max="100" th:field="*{valorFinal}" style="position: absolute; width: 100%; height: 20px; opacity: 0;">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const valorInicial = document.getElementById('valorInicial');
        const valorFinal = document.getElementById('valorFinal');
        const valorInicialOutput = document.getElementById('valorInicialOutput');
        const valorFinalOutput = document.getElementById('valorFinalOutput');
        const lowerThumb = document.getElementById('lowerThumb');
        const upperThumb = document.getElementById('upperThumb');
        const rangeSelected = document.querySelector('.range-selected');
        const rangeContainer = document.querySelector('.range-container');

        let isDraggingLower = false;
        let isDraggingUpper = false;

        valorInicial.addEventListener('input', () => {
            const min = parseInt(valorInicial.value);
            const max = parseInt(valorFinal.value);

            if (min >= max) {
                valorInicial.value = max - 1;
            }

            valorInicialOutput.textContent = valorInicial.value;

            lowerThumb.style.left = `${(min / 100) * 100}%`;
            rangeSelected.style.left = `${(min / 100) * 100}%`;
            rangeSelected.style.width = `${((max - min) / 100) * 100}%`;
        });

        valorFinal.addEventListener('input', () => {
            const min = parseInt(valorInicial.value);
            const max = parseInt(valorFinal.value);

            if (max <= min) {
                valorFinal.value = min + 1;
            }

            valorFinalOutput.textContent = valorFinal.value;

            upperThumb.style.left = `${(max / 100) * 100}%`;
            rangeSelected.style.width = `${((max - min) / 100) * 100}%`;
        });

        lowerThumb.addEventListener('mousedown', (e) => {
            isDraggingLower = true;
        });

        upperThumb.addEventListener('mousedown', (e) => {
            isDraggingUpper = true;
        });

        document.addEventListener('mouseup', () => {
            isDraggingLower = false;
            isDraggingUpper = false;
        });

        rangeContainer.addEventListener('mousemove', (e) => {
            if (isDraggingLower) {
                const rect = rangeContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = (x / rect.width) * 100;
                const value = Math.round((percent / 100) * 100);

                if (value >= parseInt(valorFinal.value)) {
                    valorInicial.value = parseInt(valorFinal.value) - 1;
                } else {
                    valorInicial.value = value;
                }

                valorInicial.dispatchEvent(new Event('input'));
            } else if (isDraggingUpper) {
                const rect = rangeContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = (x / rect.width) * 100;
                const value = Math.round((percent / 100) * 100);

                if (value <= parseInt(valorInicial.value)) {
                    valorFinal.value = parseInt(valorInicial.value) + 1;
                } else {
                    valorFinal.value = value;
                }

                valorFinal.dispatchEvent(new Event('input'));
            }
        });

        // Inicializa as posições dos thumbs e da faixa selecionada
        valorInicial.dispatchEvent(new Event('input'));
        valorFinal.dispatchEvent(new Event('input'));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
